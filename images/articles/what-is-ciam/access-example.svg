<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730"><title>Example: a customer opens a paid course</title><rect width="1100" height="730" rx="24" fill="#f5f7f3"/><g font-family="DejaVu Sans, sans-serif" fill="#243d33"><text x="45" y="48" font-size="17" letter-spacing="2">LAXAIHUB · SECURITY BASICS</text><text x="45" y="104" font-size="34" font-weight="bold">Example: a customer opens a paid course</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#768f81"/></marker></defs><rect x="300" y="165" width="500" height="100" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="322" y="202" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Customer signs in</text><text x="322" y="237" font-size="18" fill="#243d33" text-anchor="start">CIAM verifies the identity</text><rect x="300" y="325" width="500" height="100" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="322" y="362" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">App checks enrollment</text><text x="322" y="397" font-size="18" fill="#243d33" text-anchor="start">Server checks course permission</text><path d="M550 267V316M550 427V475H292V520M550 475H808V520" fill="none" stroke="#768f81" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="535" width="485" height="115" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="72" y="572" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Enrolled: deliver the lessons</text><text x="72" y="607" font-size="18" fill="#243d33" text-anchor="start">Allow only purchased access</text><rect x="565" y="535" width="485" height="115" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="587" y="572" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Not enrolled: do not deliver</text><text x="587" y="607" font-size="18" fill="#243d33" text-anchor="start">Offer the permitted next step</text><text x="45" y="700" font-size="19" fill="#243d33" text-anchor="start">Illustrative policy example; real systems use their configured rules.</text></g></svg>