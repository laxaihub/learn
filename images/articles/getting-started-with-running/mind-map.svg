<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Getting Started with Running — mind map</title><rect width="1100" height="820" rx="24" fill="#f5f7f3"/><g font-family="DejaVu Sans, sans-serif" fill="#243d33"><text x="45" y="48" font-size="17" letter-spacing="2">LAXAIHUB · MOVEMENT AND WELLBEING</text><text x="45" y="104" font-size="31" font-weight="bold">Getting Started with Running — mind map</text><path d="M550 520L270 230" stroke="#805126" stroke-width="3" fill="none"/><path d="M550 520L830 230" stroke="#805126" stroke-width="3" fill="none"/><path d="M550 520L270 415" stroke="#805126" stroke-width="3" fill="none"/><path d="M550 520L830 415" stroke="#805126" stroke-width="3" fill="none"/><path d="M550 520L550 700" stroke="#805126" stroke-width="3" fill="none"/><rect x="65" y="180" width="410" height="100" rx="16" fill="white" stroke="#805126" stroke-width="2"/><text x="87" y="217" font-size="23" fill="#805126" text-anchor="start" font-weight="bold">Preparation</text><text x="87" y="252" font-size="18" fill="#243d33" text-anchor="start">A suitable route and shoes</text><rect x="625" y="180" width="410" height="100" rx="16" fill="white" stroke="#805126" stroke-width="2"/><text x="647" y="217" font-size="23" fill="#805126" text-anchor="start" font-weight="bold">Warm-up</text><text x="647" y="252" font-size="18" fill="#243d33" text-anchor="start">Begin with walking</text><rect x="65" y="365" width="410" height="100" rx="16" fill="white" stroke="#805126" stroke-width="2"/><text x="87" y="402" font-size="23" fill="#805126" text-anchor="start" font-weight="bold">Walk and jog</text><text x="87" y="437" font-size="18" fill="#243d33" text-anchor="start">Build gradually</text><rect x="625" y="365" width="410" height="100" rx="16" fill="white" stroke="#805126" stroke-width="2"/><text x="647" y="402" font-size="23" fill="#805126" text-anchor="start" font-weight="bold">Recovery</text><text x="647" y="437" font-size="18" fill="#243d