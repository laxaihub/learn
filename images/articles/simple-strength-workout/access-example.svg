<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730"><title>Example: exploring gentle strength movements</title><rect width="1100" height="730" rx="24" fill="#f5f7f3"/><g font-family="DejaVu Sans, sans-serif" fill="#243d33"><text x="45" y="48" font-size="17" letter-spacing="2">LAXAIHUB · MOVEMENT AND WELLBEING</text><text x="45" y="104" font-size="31" font-weight="bold">Example: exploring gentle strength movements</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#768f81"/></marker></defs><rect x="300" y="165" width="500" height="100" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="322" y="202" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Check space and support</text><text x="322" y="237" font-size="18" fill="#243d33" text-anchor="start">Use a secure chair and solid wall</text><rect x="300" y="325" width="500" height="100" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="322" y="362" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Move slowly and breathe</text><text x="322" y="397" font-size="18" fill="#243d33" text-anchor="start">Try a few controlled repetitions</text><path d="M550 267V316M550 427V475H292V520M550 475H808V520" fill="none" stroke="#768f81" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="535" width="485" height="115" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="72" y="572" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Comfortable: finish and rest</text><text x="72" y="607" font-size="18" fill="#243d33" text-anchor="start">Record what felt manageable</text><rect x="565" y="535" width="485" height="115" rx="16" fill="white" stroke="#465b99" stroke-width="2"/><text x="587" y="572" font-size="23" fill="#465b99" text-anchor="start" font-weight="bold">Pain or illness: stop</text><text x="587" y="607" font-size="18" fill="#243d33" text-anchor="start">Adapt with appropriate guidance</text><text x="45" y="700" font-size="19" fill="#243d33" text-anchor="start">General educational guide; adapt activity to your needs.</text></g></svg>