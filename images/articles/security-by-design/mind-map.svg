<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>What Is Security by Design? — mind map</title><rect width="1100" height="820" rx="24" fill="#f5f7f3"/><g font-family="DejaVu Sans, sans-serif" fill="#243d33"><text x="45" y="48" font-size="17" letter-spacing="2">LAXAIHUB · SECURITY BASICS</text><text x="45" y="104" font-size="34" font-weight="bold">What Is Security by Design? — mind map</text><path d="M550 520L270 230" stroke="#286f59" stroke-width="3" fill="none"/><path d="M550 520L830 230" stroke="#286f59" stroke-width="3" fill="none"/><path d="M550 520L270 415" stroke="#286f59" stroke-width="3" fill="none"/><path d="M550 520L830 415" stroke="#286f59" stroke-width="3" fill="none"/><path d="M550 520L550 700" stroke="#286f59" stroke-width="3" fill="none"/><rect x="65" y="180" width="410" height="100" rx="16" fill="white" stroke="#286f59" stroke-width="2"/><text x="87" y="217" font-size="23" fill="#286f59" text-anchor="start" font-weight="bold">Understand risks</text><text x="87" y="252" font-size="18" fill="#243d33" text-anchor="start">What could go wrong?</text><rect x="625" y="180" width="410" height="100" rx="16" fill="white" stroke="#286f59" stroke-width="2"/><text x="647" y="217" font-size="23" fill="#286f59" text-anchor="start" font-weight="bold">Limit access</text><text x="647" y="252" font-size="18" fill="#243d33" text-anchor="start">Least privilege</text><rect x="65" y="365" width="410" height="100" rx="16" fill="white" stroke="#286f59" stroke-width="2"/><text x="87" y="402" font-size="23" fill="#286f59" text-anchor="start" font-weight="bold">Protect data</text><text x="87" y="437" font-size="18" fill="#243d33" text-anchor="start">Collect and retain less</text><rect x="625" y="365" width="410" height="100" rx="16" fill="white" stroke="#286f59" stroke-width="2"/><text x="647" y="402" font-size="23" fill="#286f59" text-anchor="start" font-weight="bold">Safer defaults</text><text x="647" y="437" font-size="18" fill=