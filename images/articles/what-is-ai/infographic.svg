<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><rect width="1100" height="1000" rx="32" fill="#f3f7f2"/><g font-family="DejaVu Sans, sans-serif" fill="#15382e"><text x="60" y="72" font-size="20" letter-spacing="3">LAXAIHUB · AI BASICS</text><text x="60" y="142" font-size="56" font-weight="bold">What is AI?</text><text x="60" y="191" font-size="25">Technology that helps computers work with</text><text x="60" y="227" font-size="25">words, pictures, and problems.</text><text x="60" y="302" font-size="27" font-weight="bold">Many AI systems learn from examples</text><rect x="60" y="332" width="300" height="185" rx="20" fill="white"/><text x="84" y="470" font-size="23" font-weight="bold">1. Examples</text><text x="84" y="499" font-size="18">Labeled fruit pictures</text><rect x="390" y="332" width="300" height="185" rx="20" fill="white"/><text x="414" y="470" font-size="23" font-weight="bold">2. Patterns</text><text x="414" y="499" font-size="18">Shapes and colors</text><rect x="720" y="332" width="300" height="185" rx="20" fill="white"/><text x="744" y="470" font-size="23" font-weight="bold">3. Prediction</text><text x="744" y="499" font-size="18">A new fruit picture</text><circle cx="122" cy="389" r="26" fill="#e06b56"/><path d="M122 365q8-22 24-12" fill="none" stroke="#367e56" stroke-width="6"/><path d="M178 368q-8 51 52 27q-42 9-52-27" fill="#edbd40" stroke="#b68c24" stroke-width="2"/><path d="M422 376h44m-44 22h44m34-22h44m-44 22h44" stroke="#4f9980" stroke-width="7"/><circle cx="786" cy="389" r="26" fill="#e06b56"/><text x="837" y="400" font-size="26">Apple?</text><text x="60" y="565" font-size="22">A prediction can be wrong. Check the result.</text><text x="60" y="638" font-size="27" font-weight="bold">A tiny AI timeline</text><path d="M80 683H970" stroke="#79a58c" stroke-width="5"/><circle cx="80" cy="683" r="9" fill="#21795b"/><text x="80" y="730" font-size="27" font-weight="bold">1950</text><text x="80" y="767" font-size="19">Turing explores</text><text x="80" y="794" font-size="19">machine thinking</text><circle cx="315" cy="683" r="9" fill="#21795b"/><text x="315" y="730" font-size="27" font-weight="bold">1956</text><text x="315" y="767" font-size="19">Dartmouth</text><text x="315" y="794" font-size="19">AI workshop</text><circle cx="550" cy="683" r="9" fill="#21795b"/><text x="550" y="730" font-size="27" font-weight="bold">1997</text><text x="550" y="767" font-size="19">Deep Blue wins</text><text x="550" y="794" font-size="19">a chess match</text><circle cx="785" cy="683" r="9" fill="#21795b"/><text x="785" y="730" font-size="27" font-weight="bold">2022</text><text x="785" y="767" font-size="19">ChatGPT</text><text x="785" y="794" font-size="19">launches</text><rect x="60" y="841" width="960" height="115" rx="20" fill="#163f32"/><g fill="white"><text x="88" y="882" font-size="24" font-weight="bold">Use AI wisely</text><text x="88" y="925" font-size="22">Keep things private · Check answers · Ask people for help</text></g></g></svg>